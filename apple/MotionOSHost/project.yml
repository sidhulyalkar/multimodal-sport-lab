name: MotionOSHost

attributes:
  LastUpgradeCheck: "2700"

options:
  bundleIdPrefix: com.sidhulyalkar
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  postGenCommand: |
    PROJECT="MotionOSHost.xcodeproj/project.pbxproj"
    if grep -q 'dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";' "$PROJECT"; then
      sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|'         -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' "$PROJECT"
    fi

packages:
  MotionOSAppleCapture:
    path: ../MotionOSAppleCapture

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic

targets:
  MotionOSWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidhulyalkar.motionos.watchkitapp
        PRODUCT_NAME: MotionOS
        CODE_SIGN_ENTITLEMENTS: Watch/MotionOSWatch.entitlements
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: MotionOS
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sidhulyalkar.motionos
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: MotionOS reads workout metrics such as heart rate so they can be viewed alongside movement sessions you record.
        NSHealthUpdateUsageDescription: MotionOS starts and saves the workout sessions you choose to record.
        NSMotionUsageDescription: MotionOS records wrist movement during sessions you choose to start.
    entitlements:
      path: Watch/MotionOSWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: MotionOSAppleCapture
        product: MotionOSAppleCapture

  MotionOSiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidhulyalkar.motionos
        PRODUCT_NAME: MotionOS
        CODE_SIGN_ENTITLEMENTS: iOS/MotionOSiOS.entitlements
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: MotionOS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHealthShareUsageDescription: MotionOS uses workout state to keep iPhone and Apple Watch recordings together during sessions you start.
        NSHealthUpdateUsageDescription: MotionOS starts workout sessions on your paired Apple Watch when you choose to record.
        NSMotionUsageDescription: MotionOS may use motion data while setting up or recording a movement session.
        NSCameraUsageDescription: MotionOS uses the camera during sessions you start to record your movement and help analyze technique.
    entitlements:
      path: iOS/MotionOSiOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - target: MotionOSWatch
        embed: true
      - package: MotionOSAppleCapture
        product: MotionOSAppleCapture

schemes:
  MotionOS-iOS:
    build:
      targets:
        MotionOSiOS: all
    run:
      config: Debug
    archive:
      config: Release

  MotionOS-Watch:
    build:
      targets:
        MotionOSWatch: all
    run:
      config: Debug
    archive:
      config: Release
