name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  replay-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:ui-model

  apple-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Swift contract
        run: swift test --package-path apple/MotionOSAppleCapture
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apple/MotionOSHost
        run: xcodegen generate
      - name: Build iPhone host
        run: |
          xcodebuild \
            -project apple/MotionOSHost/MotionOSHost.xcodeproj \
            -scheme MotionOS-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build Watch host
        run: |
          xcodebuild \
            -project apple/MotionOSHost/MotionOSHost.xcodeproj \
            -scheme MotionOS-Watch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
